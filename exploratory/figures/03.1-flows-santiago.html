        `<tr>

        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }

        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }

    geo_json_5d45e9ff42742e608afe5f44f7a50f0e.bindTooltip(
    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["origin", "destination", "flow", "distance_km"];
    let aliases = ["home region", "work region", "commuters", "distance km"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i]}</th>
            
            <td>${handleObject(layer.feature.properties[v])}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
    ,{
  "sticky": true,
  "className": "foliumtooltip",
});
